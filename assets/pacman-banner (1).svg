<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pixel { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: 4px; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="220" fill="#000000"/>

  <!-- maze border -->
  <rect x="10" y="10" width="1180" height="200" fill="none" stroke="#2121DE" stroke-width="6"/>
  <rect x="20" y="20" width="1160" height="180" fill="none" stroke="#2121DE" stroke-width="2" stroke-dasharray="10,6"/>

  <!-- corner maze nubs -->
  <rect x="10" y="10" width="24" height="24" fill="#000000" stroke="#2121DE" stroke-width="4"/>
  <rect x="1166" y="10" width="24" height="24" fill="#000000" stroke="#2121DE" stroke-width="4"/>
  <rect x="10" y="186" width="24" height="24" fill="#000000" stroke="#2121DE" stroke-width="4"/>
  <rect x="1166" y="186" width="24" height="24" fill="#000000" stroke="#2121DE" stroke-width="4"/>

  <!-- dot trail -->
  <g id="dots" fill="#FFB897">
    <circle cx="70" cy="60" r="4"/>
    <circle cx="110" cy="60" r="4"/>
    <circle cx="150" cy="60" r="4"/>
    <circle cx="190" cy="60" r="4"/>
    <circle cx="230" cy="60" r="4"/>
    <circle cx="270" cy="60" r="4"/>
    <circle cx="310" cy="60" r="4"/>
    <circle cx="350" cy="60" r="4"/>
    <circle cx="390" cy="60" r="4"/>
    <circle cx="430" cy="60" r="4"/>
    <circle cx="470" cy="60" r="4"/>
    <circle cx="510" cy="60" r="4"/>
    <circle cx="550" cy="60" r="4"/>
    <circle cx="590" cy="60" r="4"/>
    <circle cx="630" cy="60" r="4"/>
    <circle cx="670" cy="60" r="4"/>
    <circle cx="710" cy="60" r="4"/>
    <circle cx="750" cy="60" r="4"/>
    <circle cx="790" cy="60" r="4"/>
    <circle cx="830" cy="60" r="4"/>
    <circle cx="870" cy="60" r="4"/>
    <circle cx="910" cy="60" r="4"/>
    <circle cx="950" cy="60" r="4"/>
    <circle cx="990" cy="60" r="4"/>
    <circle cx="1030" cy="60" r="4"/>
    <circle cx="1070" cy="60" r="4"/>
    <circle cx="1110" cy="60" r="4"/>
  </g>

  <!-- power pellet -->
  <circle cx="1140" cy="60" r="9" fill="#FFB897">
    <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ghosts trailing, fleeing left to right behind pacman -->
  <g>
    <g transform="translate(-60,42)">
      <path d="M0 18 a18 18 0 0 1 36 0 v18 l-6 -6 -6 6 -6 -6 -6 6 -6 -6 -6 6 z" fill="#FF0000"/>
      <circle cx="11" cy="16" r="4" fill="white"/><circle cx="25" cy="16" r="4" fill="white"/>
      <circle cx="12" cy="16" r="2" fill="#000080"/><circle cx="26" cy="16" r="2" fill="#000080"/>
      <animateMotion path="M0,0 H1300" dur="6s" repeatCount="indefinite" begin="0.4s"/>
    </g>
    <g transform="translate(-100,42)">
      <path d="M0 18 a18 18 0 0 1 36 0 v18 l-6 -6 -6 6 -6 -6 -6 6 -6 -6 -6 6 z" fill="#FFB8FF"/>
      <circle cx="11" cy="16" r="4" fill="white"/><circle cx="25" cy="16" r="4" fill="white"/>
      <circle cx="12" cy="16" r="2" fill="#000080"/><circle cx="26" cy="16" r="2" fill="#000080"/>
      <animateMotion path="M0,0 H1300" dur="6s" repeatCount="indefinite" begin="0.6s"/>
    </g>
    <g transform="translate(-140,42)">
      <path d="M0 18 a18 18 0 0 1 36 0 v18 l-6 -6 -6 6 -6 -6 -6 6 -6 -6 -6 6 z" fill="#00FFFF"/>
      <circle cx="11" cy="16" r="4" fill="white"/><circle cx="25" cy="16" r="4" fill="white"/>
      <circle cx="12" cy="16" r="2" fill="#000080"/><circle cx="26" cy="16" r="2" fill="#000080"/>
      <animateMotion path="M0,0 H1300" dur="6s" repeatCount="indefinite" begin="0.8s"/>
    </g>
  </g>

  <!-- pacman -->
  <g transform="translate(-40,42)">
    <path fill="#FFFF00">
      <animate attributeName="d" dur="0.35s" repeatCount="indefinite"
        values="
        M18,18 L34,7 A18,18 0 1,0 34,29 Z;
        M18,18 L34,15 A18,18 0 1,0 34,21 Z;
        M18,18 L34,7 A18,18 0 1,0 34,29 Z"/>
    </path>
    <animateMotion path="M0,0 H1300" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- title text -->
  <text x="600" y="120" text-anchor="middle" class="pixel" font-size="40" fill="#FFCC00">LEARNINGWITHSHAUN</text>
  <text x="600" y="155" text-anchor="middle" class="pixel" font-size="16" fill="#00FFFF">BACKEND &amp; FULL-STACK DEVELOPER · READY PLAYER ONE</text>

  <!-- score/lives row like arcade HUD -->
  <text x="30" y="205" class="pixel" font-size="12" fill="#FFFFFF">1UP  00</text>
  <text x="1050" y="205" class="pixel" font-size="12" fill="#FFFFFF">HIGH SCORE</text>
</svg>
